name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Optional luau-compile setup (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          curl -sSLf https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip -o luau.zip
          unzip -o luau.zip luau-compile -d /usr/local/bin && chmod +x /usr/local/bin/luau-compile
          rm -f luau.zip

      - name: Lint with ruff
        run: ruff check sharp_mcp tests

      - name: Run unittest suite
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
